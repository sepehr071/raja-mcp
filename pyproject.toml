[project]
name = "raja-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for Raja (raja.ir), the Iranian train ticket seller: stations, train search with prices and free seats, timetables, news."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sepehr Radmard", email = "sepehrr80@gmail.com" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "raja", "raja-ir", "raja-passenger-trains", "train", "train-tickets", "railway", "iran-railways", "bilit-ghatar", "timetable", "travel", "iran", "claude", "persian", "farsi", "ai-agents", "mcp-server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "httpx-curl-cffi>=0.1.5",
    "curl-cffi>=0.16.3",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/sepehr071/raja-mcp"
Repository = "https://github.com/sepehr071/raja-mcp"
Issues = "https://github.com/sepehr071/raja-mcp/issues"
Website = "https://mcpfarsi.ir/"

[project.scripts]
raja-mcp = "raja_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real raja.ir APIs (run with -m live)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long Field(description=...) strings read better on one line
